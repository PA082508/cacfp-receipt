<!doctype html>
<!--
  Scan child form (v2, 2026-09-13) — hand-off module of the cacfp-receipt app.

  ДВЕРЬ ДОКУМЕНТА, НЕ OCR (канон 25.08 «скан не рождает запись»). Офис фотографирует
  ПОДПИСАННУЮ бумагу; фото ложится в ДЕЛО РЕБЁНКА (menumaker.documents, source=uploaded)
  через edge scan-file-document. Данные с бумаги вносит офис — здесь их НЕ читают.

  Замок: секрет-ссылка центра  ?center=<uuid>&k=<raw>  (mint_document_scan_key). Список
  детей приходит ТОЛЬКО по валидному ключу (scan_children_for_key), только этого центра.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c35" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Scan child form</title>
  <style>
    /* Мягкая светлая тема по образцу платформы. */
    :root{ --bg:#f0fdf4; --surface:#ffffff; --surface2:#f6faf7; --border:#d5e5da;
           --brand:#0f4c35; --brand-soft:#e7f4ec; --text:#14231a; --muted:#5b6b60; --danger:#b42318; }
    *{ box-sizing:border-box; font-family:-apple-system,"DM Sans",system-ui,sans-serif; }
    body{ margin:0; background:var(--bg); color:var(--text); }
    header{ background:var(--brand); color:#fff; padding:16px 18px; font-size:20px; font-weight:700;
            display:flex; align-items:center; gap:10px; }
    .back{ background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.5);
           border-radius:8px; padding:5px 12px; font-size:14px; font-weight:600; cursor:pointer; }
    main{ padding:18px; max-width:520px; margin:0 auto; }
    label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
    select,input[type=date],button{ width:100%; padding:13px 14px; border-radius:10px; font-size:16px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); }
    button.primary{ background:var(--brand); color:#fff; border:none; font-weight:700; margin-top:18px; }
    button:disabled{ opacity:.5; }
    .types{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .types button{ font-size:14px; font-weight:600; }
    .types button.sel{ background:var(--brand); color:#fff; border-color:var(--brand); }
    .capture{ margin-top:8px; border:2px dashed var(--border); border-radius:12px; padding:22px; text-align:center; background:var(--surface); cursor:pointer; }
    .capture img{ max-width:100%; border-radius:10px; }
    .note{ font-size:13px; color:var(--muted); margin-top:10px; line-height:1.5; }
    .ok{ background:var(--brand-soft); border:1px solid #bbf7d0; border-radius:12px; padding:16px; margin-top:16px; }
    .err{ background:#fef2f2; border:1px solid #f4c7c7; color:var(--danger); border-radius:12px; padding:14px; margin-top:14px; font-size:14px; }
    .center-line{ font-size:13px; color:var(--muted); margin-top:6px; }
    input[type=file]{ display:none; }
  </style>
</head>
<body>
  <header>
    <button class="back" onclick="location.href='index.html'">← Back</button>
    <span>📄 Scan child form</span>
  </header>
  <main id="app"><div class="note">Loading…</div></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ── menumaker (публичный anon-ключ; замок — ключ центра, не этот ключ) ──────
    const MENUMAKER_URL = 'https://trrmyqfpxntmgxnqkikp.supabase.co'
    const MENUMAKER_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRycm15cWZweG50bWd4bnFraWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTczMzMsImV4cCI6MjA5NjE3MzMzM30.b2zlijzzwPPgZqTFNrOvhgNWZpBSxmQQioErMpoX_Ko'

    // Детские типы (per_child словаря menumaker). Сервер всё равно проверяет, что тип
    // per_child + intake_route='child'. Верный код IEA — ieg_application.
    const TYPES = [
      { code:'cacfp_enrollment',            label:'CACFP Enrollment' },
      { code:'ieg_application',             label:'Income Eligibility (IEA)' },
      { code:'dcy_01234',                   label:'DCY 01234 — Enrollment & Health' },
      { code:'dcy_01236',                   label:'DCY 01236 — Care Plan' },
      { code:'dcy_01305',                   label:'JFS 01305 — Medical Statement' },
      { code:'special_diet_statement',      label:'Special Diet / Medical' },
      { code:'child_release_authorization', label:'Child Release Authorization' },
    ]

    const qs = new URLSearchParams(location.search)
    const CENTER = (qs.get('center') || '').trim()
    const KEY = (qs.get('k') || '').trim()
    const app = document.getElementById('app')
    const state = { children:null, roster:'', type:'cacfp_enrollment', date:'', imageData:null, busy:false, result:null, error:null }

    async function rpc(fn, args) {
      const r = await fetch(`${MENUMAKER_URL}/rest/v1/rpc/${fn}`, {
        method:'POST',
        headers:{ 'apikey':MENUMAKER_ANON, 'Authorization':'Bearer '+MENUMAKER_ANON,
                  'Content-Type':'application/json', 'Content-Profile':'menumaker' },
        body: JSON.stringify(args),
      })
      if (!r.ok) throw new Error('API '+r.status)
      return r.json()
    }

    async function loadChildren() {
      if (!CENTER || !KEY) { state.error = 'This page needs the center scan link from the office.'; render(); return }
      try {
        const res = await rpc('scan_children_for_key', { p_center: CENTER, p_key: KEY })
        if (!res || !res.ok) { state.error = (res && res.message) || 'This scan link is not valid. Ask the office for a fresh link.'; render(); return }
        state.children = res.children || []
        render()
      } catch (e) { state.error = 'Could not load the child list. Check the connection and try again.'; render() }
    }

    function render() {
      if (state.error) { app.innerHTML = `<div class="err">⚠︎ ${esc(state.error)}</div>`; return }
      if (state.children === null) { app.innerHTML = '<div class="note">Loading the children for this center…</div>'; return }
      if (state.result) { app.innerHTML = renderResult(state.result); wireResult(); return }

      app.innerHTML = `
        <label>Child this paper is about</label>
        <select id="child">
          <option value="">— pick the child —</option>
          ${state.children.map(c=>`<option value="${c.roster_id}" ${c.roster_id===state.roster?'selected':''}>${esc(c.name||'—')}</option>`).join('')}
        </select>

        <label>Form type</label>
        <div class="types">
          ${TYPES.map(t=>`<button data-type="${t.code}" class="${state.type===t.code?'sel':''}">${esc(t.label)}</button>`).join('')}
        </div>

        <label>Date printed on the document <span style="text-transform:none;color:var(--muted)">(not today)</span></label>
        <input type="date" id="date" value="${state.date}" max="${new Date().toISOString().slice(0,10)}" />

        <label>Photo of the signed form</label>
        <div class="capture" id="capture">
          ${state.imageData ? `<img src="${state.imageData}" alt="scan preview" />` : '📷 Tap to take a photo'}
        </div>
        <input type="file" id="file" accept="image/*" capture="environment" />

        <button class="primary" id="submit" ${(!state.roster||!state.date||!state.imageData||state.busy)?'disabled':''}>
          ${state.busy ? 'Saving…' : 'Save to child’s file'}
        </button>
        <div class="note">The photo of the signed paper is filed to the child’s record; the data itself is entered by the office.</div>
      `
      app.querySelector('#child').onchange = e => { state.roster = e.target.value }
      app.querySelector('#date').onchange = e => { state.date = e.target.value; toggleSubmit() }
      app.querySelector('#child').addEventListener('change', toggleSubmit)
      app.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { state.type = b.dataset.type; render() })
      app.querySelector('#capture').onclick = () => app.querySelector('#file').click()
      app.querySelector('#file').onchange = onFile
      app.querySelector('#submit').onclick = onSubmit
    }
    function toggleSubmit(){ const b=app.querySelector('#submit'); if(b) b.disabled = !(state.roster&&state.date&&state.imageData&&!state.busy) }

    function renderResult(r){
      if (r.error) return `<div class="err">⚠︎ ${esc(r.error)}</div><button class="primary" id="again">Try again</button>`
      return `<div class="ok">✅ ${esc(r.message||'Saved to the child’s file.')}</div><button class="primary" id="again">Scan another</button>`
    }
    function wireResult(){ const b=app.querySelector('#again'); if(b) b.onclick=()=>{ state.result=null; state.imageData=null; state.roster=''; state.date=''; render() } }

    function onFile(e){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ state.imageData=rd.result; render() }; rd.readAsDataURL(f) }

    async function onSubmit(){
      state.busy=true; render()
      try {
        const res = await fetch(`${MENUMAKER_URL}/functions/v1/scan-file-document`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+MENUMAKER_ANON },
          body: JSON.stringify({ center:CENTER, key:KEY, roster:state.roster, doc_type:state.type, document_date:state.date, image:state.imageData }),
        })
        const out = await res.json()
        if (!res.ok || !out.ok) throw new Error(out.message || `Save failed (${res.status})`)
        state.result = { message: out.message }
      } catch (e) { state.result = { error: e.message || String(e) } }
      finally { state.busy=false; render() }
    }

    function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

    // ── мягкое анти-стейл: сеть-вперёд SW + перезагрузка на новую версию ──────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{})
      let reloaded=false
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!reloaded){ reloaded=true; location.reload() } })
    }
    loadChildren()
  </script>
</body>
</html>
